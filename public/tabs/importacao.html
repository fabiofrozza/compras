<!DOCTYPE html>
<div class="row">
    <div class="col-5">
        <!-- Form link planilha -->
        <form id="form-importacao-link" class="script-form shadow-sm">
            <h4><i class="material-symbols-outlined">add_to_drive</i> Link da Lista</h4>

            <div class="row">
                <div class="col">
                    <label for="importacao-link" class="form-label" data-bs-toggle="tooltip"
                        data-bs-title="Link da aba LISTA FINAL da planilha de inserção de demandas.">
                        Link da Planilha do Google Drive
                    </label>
                    <input type="url" class="form-control form-control-sm" id="importacao-link"
                        data-field="planilha_link" placeholder="https://docs.google.com/spreadsheets/d/..." required>
                    <div id="importacao-sheet-status"
                        class="alert alert-light border d-flex align-items-start p-1 mt-2 mb-2" role="alert">
                        <div id="icon-status-link" class="me-2 text-muted">
                            <i class="material-symbols-outlined">info</i>
                        </div>
                        <span id="texto-status-link" class="text-primary-emphasis">Insira o link da planilha para
                            validação.</span>
                    </div>
                </div>
            </div>
            <div class="form-buttons">
                <button type="button" data-bs-toggle="tooltip" data-bs-title="Limpar todos os campos"
                    class="btn btn-outline-danger btn-sm" onclick="limparFormulario('form-importacao-link')">
                    <i class="material-symbols-outlined">backspace</i>
                </button>
            </div>
        </form>
        <!-- Form configurações -->
        <form id="form-importacao-config" class="script-form shadow-sm">
            <h4><i class="material-symbols-outlined">settings</i> Configurações</h4>

            <div class="row">
                <div class="col">
                    <div class="form-group">
                        <label for="importacao-val-min" class="form-label" data-bs-toggle="tooltip"
                            data-bs-title="Valor mínimo total do item para inclusão no processo">
                            Valor Mínimo
                        </label>
                        <input type="number" class="form-control form-control-sm" id="importacao-val-min"
                            data-field="valor_minimo" data-validate-rule="numeric" min="1" required>
                    </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label for="importacao-qtd-min" class="form-label" data-bs-toggle="tooltip"
                            data-bs-title="Quantidade mínima demandada do item para inclusão no processo">
                            Qtd. Mínima
                        </label>
                        <input type="number" class="form-control form-control-sm" id="importacao-qtd-min"
                            data-field="qtd_minima" data-validate-rule="numeric" min="1" required>
                    </div>
                </div>
                <div class="col">

                    <div class="form-group">
                        <label for="importacao-celula" class="form-label" data-bs-toggle="tooltip"
                            data-bs-title="Célula da LISTA FINAL onde inicia a área de inserção dos quantitativos pelas Unidades (ex: Q6)">
                            Célula Inicial
                        </label>
                        <input type="text" class="form-control form-control-sm" id="importacao-celula"
                            data-field="celula_inicial" data-validate-rule="pattern"
                            data-regex-pattern="^[A-Za-z]+[1-9][0-9]*$" placeholder="Ex: Q6" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <div class="form-group">
                        <label for="importacao-qtd-un" class="form-label" data-bs-toggle="tooltip"
                            data-bs-title="Quantidade de colunas de Unidades requerentes (incluindo ocultas)">
                            Qtd. Unidades
                        </label>
                        <input type="number" class="form-control form-control-sm" id="importacao-qtd-un"
                            data-field="qtd_unidades" min="1" data-validate-rule="numeric" min="1" required>
                    </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label for="importacao-aba-menu" class="form-label" data-bs-toggle="tooltip"
                            data-bs-title="Nome da aba Menu na planilha (apenas letras, números e espaços)">
                            Aba Menu
                        </label>
                        <input type="text" class="form-control form-control-sm" id="importacao-aba-menu"
                            data-field="aba_menu" placeholder="Ex: Menu" required>
                    </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label for="importacao-aba-lista" class="form-label" data-bs-toggle="tooltip"
                            data-bs-title="Nome da aba LISTA FINAL na planilha (apenas letras, números e espaços)">
                            Aba LISTA FINAL
                        </label>
                        <input type="text" class="form-control form-control-sm" id="importacao-aba-lista"
                            data-field="aba_lista_final" placeholder="Ex: LISTA FINAL" value="LISTA FINAL" required>
                    </div>
                </div>
            </div>
            <div class="form-buttons">
                <button type="button" data-bs-toggle="tooltip" data-bs-title="Limpar todos os campos"
                    class="btn btn-outline-danger btn-sm" onclick="limparFormulario('form-importacao-config')">
                    <i class="material-symbols-outlined">backspace</i>
                </button>
            </div>
        </form>
    </div>
    <div class="col-7">
        <ul class="nav nav-tabs" id="importacaoTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-arquivos-importacao" data-bs-toggle="tab"
                    data-bs-target="#content-arquivos-importacao" type="button" role="tab">
                    <i class="material-symbols-outlined">description</i> Arquivos para importação
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-resumo-pedidos" data-bs-toggle="tab"
                    data-bs-target="#content-resumo-pedidos" type="button" role="tab">
                    <i class="material-symbols-outlined">receipt_long</i> Resumo dos pedidos
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-relatorio-gerencial" data-bs-toggle="tab"
                    data-bs-target="#content-relatorio-gerencial" type="button" role="tab">
                    <i class="material-symbols-outlined">pie_chart</i> Relatório gerencial
                </button>
            </li>
        </ul>

        <div class="script-form shadow-sm" id="importacaoTabsForm">
            <div class="tab-content" id="importacaoTabsContent">

                <div class="tab-pane fade show active" id="content-arquivos-importacao" role="tabpanel">
                    <div class="row">
                        <div class="col">
                            <h4>Arquivos para importar</h4>
                            <div id="importacao-arquivos-csv" class="files-list" data-folder="ARQUIVOS_IMPORTAR"
                                data-extensions="csv" data-selectable="false"></div>
                        </div>
                        <div class="col">
                            <h4>Descrição de itens a ajustar</h4>
                            <div id="importacao-arquivos-xlsx" class="files-list" data-folder="ARQUIVOS_IMPORTAR"
                                data-extensions="xlsx" data-selectable="false"></div>
                        </div>
                    </div>
                    <div class="form-buttons mt-3">
                        <button type="button" class="btn btn-sm btn-primary btn-run" id="btn-importacao-arquivos"
                            onclick="executarAcaoImportacao('gerar')" disabled>
                            Gerar arquivos para importar
                        </button>
                    </div>
                </div>

                <div class="tab-pane fade" id="content-resumo-pedidos" role="tabpanel">
                    <div class="row">
                        <div class="col">
                            <h4>Prints das telas dos pedidos</h4>
                            <div id="importacao-resumos-pdf" class="files-list" data-folder="RESUMO_PEDIDOS"
                                data-extensions="pdf" data-selectable="false"></div>
                        </div>
                        <div class="col">
                            <h4>Resumos gerados</h4>
                            <div id="importacao-resumos-xlsx" class="files-list" data-folder="RESUMO_PEDIDOS"
                                data-extensions="xlsx" data-selectable="false"></div>
                        </div>
                    </div>
                    <div class="form-buttons mt-3">
                        <button type="button" class="btn btn-sm btn-primary btn-run" id="btn-importacao-resumo"
                            onclick="executarAcaoImportacao('resumo')" disabled>
                            Gerar resumo dos pedidos
                        </button>
                    </div>
                </div>

                <div class="tab-pane fade" id="content-relatorio-gerencial" role="tabpanel">
                    <div class="row mb-3">
                        <div class="col-6">
                            <label for="importacao-combo-spa" class="form-label" data-bs-toggle="tooltip"
                                data-bs-title="Selecione o processo para geração do relatório (ou consolidado)">
                                Processo SPA
                            </label>
                            <select class="form-select form-select-sm" id="importacao-combo-spa"
                                data-field="processo_selecionado">
                                <option value="">-- Processos --</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <h4>Planilha auxiliar para DFD</h4>
                            <div id="importacao-relatorios-xlsx" class="files-list" data-folder="RELATORIOS"
                                data-extensions="xlsx" data-selectable="false"></div>
                        </div>
                        <div class="col">
                            <h4>Relatórios gerenciais</h4>
                            <div id="importacao-relatorios-pdf" class="files-list" data-folder="RELATORIOS"
                                data-extensions="pdf" data-selectable="false"></div>
                        </div>
                    </div>
                    <div class="form-buttons mt-3">
                        <button type="button" class="btn btn-sm btn-primary btn-run" id="btn-importacao-relatorio"
                            onclick="executarAcaoImportacao('relatorio')" disabled>
                            Gerar relatório gerencial
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
