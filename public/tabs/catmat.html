<!DOCTYPE html>
<div class="row">
    <div class="col">
        <!-- Itens do TR -->
        <div id="form-itens-tr" class="script-form shadow-sm">
            <h4>
                <i class="fa-solid fa-basket-shopping"></i> Itens do TR
            </h4>
            <div id="catmat-lista-itens-tr" class="files-list" data-field="lista-itens-tr"
                data-validate-rule="file-selectable" required data-folder="tr" data-selectable="true">
            </div>
        </div>
    </div>
    <div class="col">
        <!-- Escolha para execução -->
        <form id="form-catmat" class="script-form shadow-sm">
            <h4><i class="fa-solid fa-filter"></i> Forma de consulta</h4>
            <div class="form-group">
                <label for="catmat-metodo" class="form-label">
                    Escolha a forma de consulta das margens de preferência:
                </label>
                <select class="form-select form-select-sm" id="catmat-metodo"
                    aria-label="Forma de geração das listas prévias">
                    <option selected value="lista">Lista de CATMATs - Consulta manual</option>
                    <option value="api">API - Consulta direta aos Dados Abertos</option>
                </select>
            </div>
            <div class="form-buttons">
                <button type="button" class="btn btn-sm btn-primary btn-run text-nowrap" id="btn-form-itens-tr"
                    data-script-name="catmat">
                    Verificar margens de preferência
                </button>
            </div>
        </form>
        <!-- Listas processadas -->
        <div class="script-form shadow-sm">
            <h4><i class="fa-solid fa-percent"></i> Margens de preferência</h4>
            <div id="catmat-arquivos-gerados" class="files-list" data-folder="arquivos_gerados" data-selectable="false">
            </div>
        </div>
    </div>
</div>
