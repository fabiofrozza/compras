<!DOCTYPE html>
<div class="row row-cols-1">
    <div class="col-sm-12">
        <!-- Formulário de seleção do painel -->
        <form id="form-powerbi-panel" class="script-form shadow-sm">
            <h4 class="d-flex justify-content-between align-items-center" role="button" data-bs-toggle="collapse"
                data-bs-target="#powerbi-painel-collapse" aria-expanded="true" aria-controls="powerbi-painel-collapse">
                <span><i class="material-symbols-outlined">show_chart</i> Painel do Observatório</span>
                <i class="material-symbols-outlined text-secondary">unfold_more</i>
            </h4>
            <div class="collapse show" id="powerbi-painel-collapse">
                <div class="form-group">
                    <div class="option-card-group">
                        <label class="option-card">
                            <div>
                                <div class="option-card-title">Planejamento</div>
                                <div class="option-card-description">Será acessada a planilha de controle para
                                    recuperar os dados dos processos, Unidades requerentes e situação do envio da
                                    documentação.</div>
                            </div>
                            <input class="form-check-input" type="radio" name="powerbi-tipo" value="planejamento"
                                checked>
                        </label>
                        <label class="option-card">
                            <div>
                                <div class="option-card-title">Licitação</div>
                                <div class="option-card-description">Serão obtidos os dados dos Mapas de Licitação da
                                    pasta 'Mapa de licitações'.</div>
                            </div>
                            <input class="form-check-input" type="radio" name="powerbi-tipo" value="licitacao">
                        </label>
                        <label class="option-card">
                            <div>
                                <div class="option-card-title">Execução</div>
                                <div class="option-card-description">Serão obtidos os dados dos relatórios de execução
                                    das AFs/Empenhos da pasta 'Execução AF Empenho'.</div>
                            </div>
                            <input class="form-check-input" type="radio" name="powerbi-tipo" value="execucao">
                        </label>
                        <label class="option-card">
                            <div>
                                <div class="option-card-title">Processos Administrativos e Alterações Contratuais
                                </div>
                                <div class="option-card-description">Será acessada a planilha de controle para
                                    recuperar os dados dos processos administrativos, trocas de marca, cancelamentos
                                    e reequilíbrios.</div>
                            </div>
                            <input class="form-check-input" type="radio" name="powerbi-tipo" value="paalteracoes">
                        </label>
                        <label class="option-card">
                            <div>
                                <div class="option-card-title">Todos os Painéis</div>
                            </div>
                            <input class="form-check-input" type="radio" name="powerbi-tipo" value="todos">
                        </label>
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn btn-sm btn-primary btn-run text-nowrap" id="btn-run-powerbi-panel"
                        onclick="executarPowerBI(this)">
                        Gerar dados
                    </button>
                </div>
            </div>
        </form>
    </div>
    <div class="col-sm-6">
        <!-- Pasta da base de dados -->
        <form id="form-powerbi-path" class="script-form shadow-sm">
            <h4 class="d-flex justify-content-between align-items-center" role="button" data-bs-toggle="collapse"
                data-bs-target="#powerbi-base-collapse" aria-expanded="true" aria-controls="powerbi-base-collapse">
                <span><i class="material-symbols-outlined">table_chart</i> Base de dados</span>
                <i class="material-symbols-outlined text-secondary">unfold_more</i>
            </h4>

            <div class="collapse show" id="powerbi-base-collapse">
                <div class="form-sub-container">
                    <button type="button" data-bs-toggle="tooltip" data-bs-title="Limpar todos os campos"
                        class="form-sub-btn" onclick="limparFormulario('form-powerbi-path')">
                        <i class="material-symbols-outlined">ink_eraser</i>
                    </button>
                    <div class="form-group" style="margin-bottom: 0">
                        <label for="powerbi-pasta" class="form-label" data-bs-toggle="tooltip"
                            data-bs-title="Pasta que contém as subpastas 'Mapa de Licitações' e 'Execução AF Empenho', e onde serão salvos os arquivos gerados.">
                            Caminho da pasta
                        </label>
                        <input type="text" class="form-control form-control-sm" id="powerbi-pasta"
                            data-field="pasta_powerbi" data-validate-rule="pattern" data-regex-pattern=".+(?=\\)"
                            placeholder="Ex: G:\Google Drive\Base de Dados\POWERBI" required>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="col-sm-6">
        <!-- Formulário de manutenção -->
        <form id="form-powerbi-manutencao" class="script-form shadow-sm">
            <h4 class="d-flex justify-content-between align-items-center" role="button" data-bs-toggle="collapse"
                data-bs-target="#powerbi-manutencao-collapse" aria-expanded="true"
                aria-controls="powerbi-manutencao-collapse">
                <span><i class="material-symbols-outlined">build</i> Manutenção</span>
                <i class="material-symbols-outlined text-secondary">unfold_more</i>
            </h4>
            <div class="collapse show" id="powerbi-manutencao-collapse">
                <div class="form-group">
                    <div class="option-card-group">
                        <label class="option-card">
                            <div>
                                <div class="option-card-title">Renomear arquivos</div>
                                <div class="option-card-description">Os arquivos das pastas 'Mapa de licitações' e
                                    'Execução AF Empenho' serão renomeados conforme o padrão TIPO - ANO - ETAPA -
                                    PROCESSO - PREGÃO.</div>
                            </div>
                            <input class="form-check-input" type="radio" name="powerbi-tipo" value="renomear" checked>
                        </label>
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn btn-sm btn-primary btn-run text-nowrap"
                        id="btn-run-powerbi-maintenance" onclick="executarPowerBI(this)">
                        Executar
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
