    <!-- Bootstrap CSS and JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/global.css">

    <!-- Estilos para aviso de JavaScript desabilitado -->
    <style>
        .noscript-warning-icon {
            display: flex;
        }

        html.js-enabled .noscript-warning-icon {
            display: none !important;
        }

        .noscript-banner {
            position: fixed;
            top: var(--compras-nav-height, 48px);
            left: 0;
            width: 100%;
            z-index: 9999;
            background: linear-gradient(135deg, #b71c1c, #d32f2f);
            color: #fff;
            padding: 14px 24px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .noscript-banner i {
            font-size: 1.4rem;
        }
    </style>
</head>

<body>
    <!-- SVG Filters para efeito Liquid Glass -->
    <svg style="display: none;">
        <!-- https://codepen.io/daftplug/pen/QwbaYGO -->
        <filter id="container-glass-1" x="0%" y="0%" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise" />
            <feGaussianBlur in="noise" stdDeviation="0.02" result="blur" />
            <feDisplacementMap in="SourceGraphic" in2="blur" scale="77" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="container-glass-2" primitiveUnits="objectBoundingBox">
            <feImage href="" x="0" y="0" width="1" height="1" result="map"></feImage>
            <feGaussianBlur in="SourceGraphic" stdDeviation="0.02" result="blur"></feGaussianBlur>
            <feDisplacementMap id="disp" in="blur" in2="map" scale="1" xChannelSelector="R" yChannelSelector="G">
            </feDisplacementMap>
        </filter>
        <!-- https://codepen.io/iamryanyu/pen/gbpzgqX -->
        <filter id="container-glass-3" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox">
            <feTurbulence type="fractalNoise" baseFrequency="0.003 0.007" numOctaves="1" result="turbulence" />
            <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="200" xChannelSelector="R"
                yChannelSelector="G" />
        </filter>
        <!-- https://codepen.io/Esther-k/pen/XJbxKQq -->
        <filter id="container-glass-4" x="-50%" y="-50%" width="200%" height="200%" primitiveUnits="objectBoundingBox">
            <feImage x="-50%" y="-50%" width="200%" height="200%" result="map" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="0.02" result="blur" />
            <feDisplacementMap id="disp" in="blur" in2="map" scale="0.8" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- https://codepen.io/lassiterda/pen/vEOpqMa -->
        <filter id="container-glass-5" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" seed="5" result="turbulence" />
            <!-- Seeds: 14, 17,  -->
            <feComponentTransfer in="turbulence" result="mapped">
                <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5" />
                <feFuncG type="gamma" amplitude="0" exponent="1" offset="0" />
                <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5" />
            </feComponentTransfer>
            <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
            <feSpecularLighting in="softMap" surfaceScale="5" specularConstant="1" specularExponent="100"
                lighting-color="white" result="specLight">
                <fePointLight x="-200" y="-200" z="300" />
            </feSpecularLighting>
            <feComposite in="specLight" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litImage" />
            <feDisplacementMap in="SourceGraphic" in2="softMap" scale="150" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- https://codepen.io/alexerlandsson/pen/GgJQEKE -->
        <filter id="container-glass-6" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
            <feTurbulence type="fractalNoise" baseFrequency="0.001 0.005" numOctaves="1" seed="17"
                result="turbulence" />
            <feComponentTransfer in="turbulence" result="mapped">
                <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5" />
                <feFuncG type="gamma" amplitude="0" exponent="1" offset="0" />
                <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5" />
            </feComponentTransfer>
            <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
            <feSpecularLighting in="softMap" surfaceScale="5" specularConstant="1" specularExponent="100"
                lighting-color="white" result="specLight">
                <fePointLight x="-200" y="-200" z="300" />
            </feSpecularLighting>
            <feComposite in="specLight" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litImage" />
            <feDisplacementMap in="SourceGraphic" in2="softMap" scale="200" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <!-- Barra de navegação superior fixa -->
    <header class="top-nav shadow" id="navbar">
        <div class="navbar-left">
            <img src="img/company.png" class="navbar-logo" id="companyLogo" alt="Logo da empresa">
            <div class="nav-subtitle" id="nav-subtitle"></div>
        </div>

        <div class="navbar-center">
        </div>

        <div class="header-actions" id="header-actions">
            <button class="header-icon-btn noscript-warning-icon" aria-label="JavaScript desabilitado"
                data-bs-toggle="tooltip" data-bs-title="JavaScript está desabilitado" data-bs-placement="bottom"
                style="color: #ef4444;">
                <i class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1, 'wght' 600;">error</i>
            </button>
            <div class="header-separator noscript-warning-icon" role="separator"></div>
            <button id="darkModeBtn" class="header-icon-btn" aria-label="Ativar/desativar modo escuro"
                data-bs-toggle="tooltip" data-bs-title="Ativar/desativar modo escuro" data-bs-placement="bottom"
                onclick="applyDarkMode()">
                <i class="material-symbols-outlined">light_mode</i>
            </button>
            <button id="fullscreenBtn" class="header-icon-btn" aria-label="Tela inteira" data-bs-toggle="tooltip"
                data-bs-title="Tela inteira" data-bs-placement="bottom">
                <i class="material-symbols-outlined">fullscreen</i>
            </button>
            <div class="header-separator" role="separator"></div>
            <button id="notificationsBtn" class="header-icon-btn" aria-label="Notificações" data-bs-toggle="tooltip"
                data-bs-title="Notificações" data-bs-placement="bottom">
                <i class="material-symbols-outlined">notifications</i>
            </button>
            <div class="header-separator" role="separator"></div>
            <button id="helpBtn" class="header-icon-btn" aria-label="Ajuda" data-bs-toggle="tooltip"
                data-bs-title="Ajuda" data-bs-placement="bottom">
                <i class="material-symbols-outlined">help</i>
            </button>
            <button id="settingsBtn" class="header-icon-btn" aria-label="Preferências" data-bs-toggle="tooltip"
                data-bs-title="Preferências" data-bs-placement="bottom">
                <i class="material-symbols-outlined">settings_account_box</i>
            </button>
            <div class="header-separator" role="separator"></div>
            <button id="appLauncherBtn" class="header-icon-btn" aria-label="Aplicativos" data-bs-toggle="tooltip"
                data-bs-title="Aplicativos" data-bs-placement="bottom">
                <i class="material-symbols-outlined">apps</i>
            </button>
        </div>
    </header>

    <div class="d-none" id="hidden-tablist" role="tablist"></div>

    <!-- Aviso exibido quando JavaScript está desabilitado -->
    <noscript>
        <div class="noscript-banner">
            <i class="material-symbols-outlined">error</i>
            <span>JavaScript está desabilitado no seu navegador. Esta página requer JavaScript para funcionar
                corretamente. Por favor, habilite o JavaScript nas configurações do seu navegador.</span>
        </div>
    </noscript>

    <main class="tab-content" id="tabContent"></main>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Painel de Configurações (Settings Panel) -->
    <div id="settings-panel" class="header-panel" role="dialog" aria-label="Configurações" aria-hidden="true">
        <div class="header-panel-header">
            <span><i class="material-symbols-outlined me-2">settings_account_box</i>Preferências</span>
            <button class="header-panel-close" id="settingsPanelClose" aria-label="Fechar"><i
                    class="material-symbols-outlined">close</i></button>
        </div>
        <div class="header-panel-body" id="settings-panel-body">
            <!-- Informações do usuário -->
            <div class="settings-user-row mb-3">
                <i class="material-symbols-outlined settings-user-avatar">account_circle</i>
                <div class="settings-user-info">
                    <span class="settings-user-name" id="userName">Carregando...</span>
                    <span class="settings-user-computer">
                        <i class="material-symbols-outlined">computer</i>
                        <span id="userComputerName"></span>
                    </span>
                    <span class="settings-user-sync" data-bs-toggle="tooltip" data-bs-placement="left"
                        data-bs-title="Última sincronização">
                        <i class="material-symbols-outlined">schedule</i>
                        <span id="lastSyncTime">-</span>
                    </span>
                </div>
            </div>
            <hr class="my-3">
            <!-- Tema -->
            <div class="form-group mb-1">
                <div class="form-check form-switch">
                    <input type="checkbox" role="switch" id="darkMode" class="form-check-input" data-field="darkMode">
                    <label for="darkMode" class="form-label">
                        <i class="material-symbols-outlined">dark_mode</i> Modo Escuro
                    </label>
                </div>
            </div>
            <!-- Animações -->
            <div class="form-group mb-1">
                <div class="form-check form-switch">
                    <input type="checkbox" role="switch" id="enableAnimations" class="form-check-input"
                        data-field="enableAnimations" checked>
                    <label for="enableAnimations" class="form-label" data-bs-toggle="tooltip" data-bs-placement="left"
                        data-bs-title="Exibe papel de parede e personagens animados. Desabilite para melhorar o desempenho.">
                        <i class="material-symbols-outlined">joystick</i> Animações
                    </label>
                </div>
            </div>
            <!-- Registro de logs -->
            <div class="form-group mb-1">
                <div class="form-check form-switch">
                    <input type="checkbox" role="switch" id="logConsent" class="form-check-input" checked>
                    <label for="logConsent" class="form-label" data-bs-toggle="tooltip" data-bs-placement="left"
                        data-bs-title="Para possibilitar o tratamento de erros, podem ser salvos logs de execução, incluindo nome de usuário, hostname e detalhes das operações realizadas.">
                        <i class="material-symbols-outlined">receipt_long</i> Salvar logs
                    </label>
                </div>
            </div>
            <hr class="my-3">
            <!-- Foto de fundo -->
            <div class="mb-1">
                <label for="bgSource" class="form-label">
                    <i class="material-symbols-outlined">image</i> Foto de fundo
                </label>
                <select id="bgSource" class="form-select form-select-sm" data-field="bgSource">
                    <option value="random">Aleatório (locais + Bing)</option>
                    <option value="bing">Fotos do dia (Bing)</option>
                    <option value="local">Fotos locais</option>
                </select>
            </div>
            <!-- Aba preferida -->
            <div class="mb-1">
                <label for="preferredTab" class="form-label">
                    <i class="material-symbols-outlined">star</i> Aba ao iniciar
                </label>
                <select id="preferredTab" class="form-select form-select-sm" data-field="preferredTab"></select>
            </div>
        </div>
    </div>

    <!-- Painel de Notificações (Notifications Panel) -->
    <div id="notifications-panel" class="header-panel" role="dialog" aria-label="Notificações" aria-hidden="true">
        <div class="header-panel-header">
            <span><i class="material-symbols-outlined me-2">notifications</i>Notificações</span>
            <button class="header-panel-close" id="notificationsPanelClose" aria-label="Fechar"><i
                    class="material-symbols-outlined">close</i></button>
        </div>
        <div class="header-panel-body" id="notifications-panel-body">
            <div class="notification-list" id="notification-list">
            </div>
            <div class="notification-footer" id="notification-footer" style="display: none;">
                <button class="notification-clear-all" id="notification-clear-all">
                    <i class="material-symbols-outlined me-1">delete</i>Limpar tudo
                </button>
            </div>
        </div>
    </div>

    <!-- Painel de Ajuda (Help Panel) -->
    <div id="help-panel" class="header-panel" role="dialog" aria-label="Ajuda" aria-hidden="true">
        <div class="header-panel-header">
            <span><i class="material-symbols-outlined me-2">help</i>Ajuda</span>
            <button class="header-panel-close" id="helpPanelClose" aria-label="Fechar"><i
                    class="material-symbols-outlined">close</i></button>
        </div>
        <div class="header-panel-body" id="help-panel-body">
        </div>
    </div>

    <!-- Painel App Launcher -->
    <div id="app-launcher-panel" class="header-panel" role="dialog" aria-label="Aplicativos" aria-hidden="true">
        <div class="header-panel-header">
            <span><i class="material-symbols-outlined me-2">apps</i>Aplicativos</span>
            <button class="header-panel-close" id="appLauncherPanelClose" aria-label="Fechar"><i
                    class="material-symbols-outlined">close</i></button>
        </div>
        <div class="header-panel-body">
            <div class="app-launcher-grid" id="app-launcher-grid">
            </div>
        </div>
    </div>
