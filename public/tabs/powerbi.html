<!DOCTYPE html>
<div class="col">
    <ul class="nav nav-tabs sub-tabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-powerbi-dados" data-bs-toggle="tab"
                data-bs-target="#content-powerbi-dados" type="button" role="tab">
                <i class="material-symbols-outlined">table_chart</i> Geração de dados
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-powerbi-status" data-bs-toggle="tab"
                data-bs-target="#content-powerbi-status" type="button" role="tab">
                <i class="material-symbols-outlined">visibility</i> Status dos processos
            </button>
        </li>
    </ul>

    <div class="script-form shadow-sm sub-tabs-content">
        <div class="tab-content">

            <div class="tab-pane fade show active" id="content-powerbi-dados" role="tabpanel">
                <div class="row row-cols-1">
                    <div class="col-sm-12">
                        <!-- Formulário de seleção do painel -->
                        <form id="form-powerbi-panel" class="script-form shadow-sm">
                            <h4 class="script-form-header"
                                data-compras-icon="show_chart" data-compras-title="Painel do Observatório">
                            </h4>
                            <div class="collapse show" id="powerbi-painel-collapse">
                                <div class="form-group">
                                    <div class="option-card-group">
                                        <label class="option-card">
                                            <i class="material-symbols-outlined option-card-icon">
                                                assignment
                                            </i>
                                            <div>
                                                <div class="option-card-title">Planejamento</div>
                                                <div class="option-card-description">Será acessada a planilha de
                                                    controle para
                                                    recuperar os dados dos processos, Unidades requerentes e situação do
                                                    envio da
                                                    documentação.</div>
                                            </div>
                                            <input class="form-check-input" type="radio" name="powerbi-tipo"
                                                value="planejamento" checked>
                                        </label>
                                        <label class="option-card">
                                            <i class="material-symbols-outlined option-card-icon">
                                                gavel
                                            </i>
                                            <div>
                                                <div class="option-card-title">Licitação</div>
                                                <div class="option-card-description">Serão obtidos os dados dos Mapas de
                                                    Licitação da
                                                    pasta 'Mapa de licitações'.</div>
                                            </div>
                                            <input class="form-check-input" type="radio" name="powerbi-tipo"
                                                value="licitacao">
                                        </label>
                                        <label class="option-card">
                                            <i class="material-symbols-outlined option-card-icon">
                                                money_range
                                            </i>
                                            <div>
                                                <div class="option-card-title">Execução</div>
                                                <div class="option-card-description">Serão obtidos os dados dos
                                                    relatórios de execução
                                                    das AFs/Empenhos da pasta 'Execução AF Empenho'.</div>
                                            </div>
                                            <input class="form-check-input" type="radio" name="powerbi-tipo"
                                                value="execucao">
                                        </label>
                                        <label class="option-card">
                                            <i class="material-symbols-outlined option-card-icon">
                                                balance
                                            </i>
                                            <div>
                                                <div class="option-card-title">Processos Administrativos e Alterações
                                                    Contratuais
                                                </div>
                                                <div class="option-card-description">Será acessada a planilha de
                                                    controle para
                                                    recuperar os dados dos processos administrativos, trocas de marca,
                                                    cancelamentos
                                                    e reequilíbrios.</div>
                                            </div>
                                            <input class="form-check-input" type="radio" name="powerbi-tipo"
                                                value="paalteracoes">
                                        </label>
                                        <label class="option-card">
                                            <i class="material-symbols-outlined option-card-icon">
                                                grid_view
                                            </i>
                                            <div>
                                                <div class="option-card-title">Todos os Painéis</div>
                                            </div>
                                            <input class="form-check-input" type="radio" name="powerbi-tipo"
                                                value="todos">
                                        </label>
                                    </div>
                                </div>
                                <div class="form-buttons">
                                    <button type="button" class="btn btn-sm btn-primary btn-run text-nowrap"
                                        id="btn-run-powerbi-panel" onclick="executarPowerBI(this)">
                                        Gerar dados
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="col-sm-6">
                        <!-- Pasta da base de dados -->
                        <form id="form-powerbi-path" class="script-form shadow-sm">
                            <h4 class="script-form-header"
                                data-compras-icon="table_chart" data-compras-title="Base de dados">
                            </h4>

                            <div class="collapse show" id="powerbi-base-collapse">
                                <div class="form-sub-container">
                                    <button type="button" data-bs-toggle="tooltip"
                                        data-bs-title="Limpar todos os campos" class="form-sub-btn"
                                        onclick="limparFormulario('form-powerbi-path')">
                                        <i class="material-symbols-outlined">ink_eraser</i>
                                    </button>
                                    <div class="form-group" style="margin-bottom: 0">
                                        <label for="powerbi-pasta" class="form-label" data-bs-toggle="tooltip"
                                            data-bs-title="Pasta que contém as subpastas 'Mapa de Licitações' e 'Execução AF Empenho', e onde serão salvos os arquivos gerados.">
                                            Caminho da pasta
                                        </label>
                                        <input type="text" class="form-control form-control-sm" id="powerbi-pasta"
                                            data-field="pasta_powerbi" data-validate-rule="pattern"
                                            data-regex-pattern=".+(?=\\)"
                                            placeholder="Ex: G:\Google Drive\Base de Dados\POWERBI" required
                                            data-validation-msg="Informe um caminho de pasta válido.">
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="col-sm-6">
                        <!-- Formulário de manutenção -->
                        <form id="form-powerbi-manutencao" class="script-form shadow-sm">
                            <h4 class="script-form-header"
                                data-compras-icon="build" data-compras-title="Manutenção">
                            </h4>
                            <div class="collapse show" id="powerbi-manutencao-collapse">
                                <div class="form-group">
                                    <div class="option-card-group">
                                        <label class="option-card">
                                            <i class="material-symbols-outlined option-card-icon">
                                                edit_note
                                            </i>
                                            <div>
                                                <div class="option-card-title">Renomear arquivos</div>
                                                <div class="option-card-description">Os arquivos das pastas 'Mapa de
                                                    licitações' e
                                                    'Execução AF Empenho' serão renomeados conforme o padrão TIPO - ANO
                                                    - ETAPA -
                                                    PROCESSO - PREGÃO.</div>
                                            </div>
                                            <input class="form-check-input" type="radio" name="powerbi-tipo"
                                                value="renomear" checked>
                                        </label>
                                    </div>
                                </div>
                                <div class="form-buttons">
                                    <button type="button" class="btn btn-sm btn-primary btn-run text-nowrap"
                                        id="btn-run-powerbi-maintenance" onclick="executarPowerBI(this)">
                                        Executar
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="content-powerbi-status" role="tabpanel">
                <div class="row row-cols-1">
                    <div class="col-sm-12">
                        <!-- Observatório a partir da Planilha de Controle -->
                        <form id="form-powerbi-observatorio" class="script-form shadow-sm">
                            <h4 class="script-form-header"
                                data-compras-icon="visibility" data-compras-title="Observatório - Status"
                                data-compras-help="Verifica se os processos da Planilha de Controle estão incluídos na pasta da base de dados.">
                            </h4>
                            <div class="collapse show" id="powerbi-observatorio-collapse">
                                <div class="form-buttons">
                                    <button type="button" class="btn btn-sm btn-primary btn-run text-nowrap"
                                        id="btn-run-powerbi-observatorio" onclick="executarObservatorio(this)">
                                        Verificar
                                    </button>
                                    <button type="button" class="btn btn-sm btn-warning text-nowrap"
                                        id="btn-filtro-problemas" onclick="toggleFiltroProblemas(this)" hidden>
                                        <i class="material-symbols-outlined">warning</i> Problemas
                                    </button>
                                    <button type="button" class="btn btn-sm btn-secondary text-nowrap"
                                        id="btn-download-powerbi-observatorio" onclick="baixarObservatorioCsv()" hidden>
                                        <i class="material-symbols-outlined">download</i> Baixar CSV
                                    </button>
                                </div>
                                <div id="powerbi-observatorio-progress-container" class="progress mt-2 d-none"
                                    style="height: 16px; overflow: visible; position: relative;">
                                    <div id="powerbi-observatorio-progress-bar"
                                        class="progress-bar progress-bar-striped progress-bar-animated text-bg-info"
                                        role="progressbar" style="width: 0%;">
                                        <span class="progress-percent-popup">0%</span>
                                    </div>
                                </div>
                                <div id="powerbi-observatorio-status" class="small text-muted mt-2"></div>
                                <div id="powerbi-observatorio-result" class="mt-2" hidden>
                                    <div id="observatorio-info-bar" class="d-flex align-items-center gap-1 mb-1 small">
                                        <span class="ms-auto d-flex align-items-center gap-1 text-muted">
                                            <span id="observatorio-info-count"></span>
                                            <span id="observatorio-sort-indicator" hidden>
                                                · Ordenado por <strong id="observatorio-sort-label"></strong>
                                            </span>
                                        </span>
                                        <button type="button" class="obs-tool-btn obs-tool-btn--danger"
                                            id="btn-limpar-filtros-obs-bar"
                                            onclick="limparFiltrosEOrdenacaoObservatorio()"
                                            title="Limpar filtros e ordenação" hidden>
                                            <i class="material-symbols-outlined">ink_eraser</i>
                                        </button>
                                    </div>
                                    <div class="table-responsive">
                                        <table class="table table-sm table-striped table-hover small mb-0">
                                            <thead class="align-top">
                                                <tr>
                                                    <th class="obs-col-sortable" data-col="ano"
                                                        onclick="ordenarObservatorio('ano')">Ano
                                                        <i class="material-symbols-outlined sort-icon">unfold_more</i>
                                                    </th>
                                                    <th class="obs-col-sortable" data-col="processo"
                                                        onclick="ordenarObservatorio('processo')">Processo <i
                                                            class="material-symbols-outlined sort-icon">unfold_more</i>
                                                    </th>
                                                    <th class="obs-col-sortable" data-col="situacao"
                                                        onclick="ordenarObservatorio('situacao')">Situação <i
                                                            class="material-symbols-outlined sort-icon">unfold_more</i>
                                                    </th>
                                                    <th class="obs-col-sortable" data-col="data"
                                                        onclick="ordenarObservatorio('data')">
                                                        Data finalização <i
                                                            class="material-symbols-outlined sort-icon">unfold_more</i>
                                                    </th>
                                                    <th class="obs-col-sortable" data-col="licitacao"
                                                        onclick="ordenarObservatorio('licitacao')">Observatório -
                                                        Licitação <i
                                                            class="material-symbols-outlined sort-icon">unfold_more</i>
                                                    </th>
                                                    <th class="obs-col-sortable" data-col="execucao"
                                                        onclick="ordenarObservatorio('execucao')">Observatório -
                                                        Execução <i
                                                            class="material-symbols-outlined sort-icon">unfold_more</i>
                                                    </th>
                                                </tr>
                                                <tr class="observatorio-filter-row" id="observatorio-filter-row">
                                                    <th data-col="ano"><select id="filtro-obs-ano"
                                                            class="form-select form-select-sm">
                                                            <option value="">Todos</option>
                                                        </select></th>
                                                    <th data-col="processo"><input type="text" id="filtro-obs-processo"
                                                            class="form-control form-control-sm"
                                                            placeholder="Buscar..."></th>
                                                    <th data-col="situacao"><select id="filtro-obs-situacao"
                                                            class="form-select form-select-sm">
                                                            <option value="">Todas</option>
                                                        </select></th>
                                                    <th data-col="data"><input type="text" id="filtro-obs-data"
                                                            class="form-control form-control-sm"
                                                            placeholder="Filtrar..."></th>
                                                    <th data-col="licitacao"><select id="filtro-obs-licitacao"
                                                            class="form-select form-select-sm">
                                                            <option value="">Todos</option>
                                                        </select></th>
                                                    <th data-col="execucao"><select id="filtro-obs-execucao"
                                                            class="form-select form-select-sm">
                                                            <option value="">Todos</option>
                                                        </select></th>
                                                </tr>
                                            </thead>
                                            <tbody id="powerbi-observatorio-tbody"></tbody>
                                        </table>
                                    </div>
                                    <div class="d-flex align-items-center gap-1 mt-1 small text-muted">
                                        <span class="ms-auto d-flex align-items-center gap-1 text-muted">
                                            <span id="observatorio-info-count-bottom"></span>
                                            <span id="observatorio-sort-indicator-bottom" hidden>
                                                · Ordenado por <strong id="observatorio-sort-label-bottom"></strong>
                                            </span>
                                        </span>
                                        <button type="button" class="obs-tool-btn obs-tool-btn--danger"
                                            id="btn-limpar-filtros-obs-bar-bottom"
                                            onclick="limparFiltrosEOrdenacaoObservatorio()"
                                            title="Limpar filtros e ordenação" hidden>
                                            <i class="material-symbols-outlined">ink_eraser</i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
