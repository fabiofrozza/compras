<!DOCTYPE html>
<div class="row">
    <div class="col">
        <ul class="nav nav-tabs sub-tabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-atas-dados" data-bs-toggle="tab"
                    data-bs-target="#content-atas-dados" type="button" role="tab">
                    <i class="material-symbols-outlined">description</i> Obtenção dos dados
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-atas-atas" data-bs-toggle="tab" data-bs-target="#content-atas-atas"
                    type="button" role="tab">
                    <i class="material-symbols-outlined">receipt_long</i> Geração de atas
                </button>
            </li>
        </ul>

        <div class="shadow-sm sub-tabs-content">
            <div class="tab-content">

                <div class="tab-pane fade show active" id="content-atas-dados" role="tabpanel">
                    <div class="row">
                        <div class="col">
                            <!-- Formulário com Informações do Pregão -->
                            <form id="form-info-pregao" class="panel shadow-sm">
                                <h4 class="panel-header" data-compras-icon="gavel"
                                    data-compras-title="Informações do Pregão" data-compras-help="Preencha os dados do pregão conforme o Diário Oficial da União (DOU) e o Termo de Referência:<br>
                                    <ul>
                                        <li><strong>Número/Ano</strong>: número sequencial e ano do pregão eletrônico.</li>
                                        <li><strong>Processo SPA</strong>: número completo no formato <code>23080.XXXXXX/XXXX-XX</code>, sem pontuação extra.</li>
                                        <li><strong>Data Pregão DOU</strong>: data da publicação do resultado/homologação no DOU.</li>
                                        <li><strong>Primeira Ata/Ano</strong>: número da primeira ata a ser gerada; as seguintes são numeradas automaticamente conforme os relatórios SICAF encontrados.</li>
                                        <li><strong>Objeto</strong>: descrição do objeto conforme o Edital, a ser inserida após &quot;REGISTRAR PREÇO...&quot; na ata.</li>
                                    </ul>">
                                </h4>

                                <div class="collapse show" id="form-info-pregao-collapse">
                                    <div class="form-sub-container form-info-pregao-grid">
                                        <button type="button" data-bs-toggle="tooltip"
                                            data-bs-title="Limpar todos os campos" class="form-sub-btn"
                                            onclick="limparFormulario('form-info-pregao')">
                                            <i class="material-symbols-outlined">ink_eraser</i>
                                        </button>
                                        <div class="form-group grid-1">
                                            <label for="atas-numero-pregao" class="form-label">
                                                Número/Ano do pregão
                                            </label>
                                            <div class="input-group input-group-sm" data-validate-rule="required"
                                                data-validate-target="atas-numero-pregao,atas-ano-pregao">
                                                <input type="number" class="form-control form-control-sm"
                                                    id="atas-numero-pregao" data-field="n_pregao" min="1"
                                                    data-validate-rule="numeric" required
                                                    data-validation-msg="Informe o número e o ano do pregão.">
                                                <select class="form-select form-select-sm" id="atas-ano-pregao"
                                                    data-field="ano_pregao" data-validate-rule="numeric" required>
                                                    <option value="">-- Selecione --</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-group grid-3">
                                            <label for="atas-processo-spa" class="form-label" data-bs-toggle="tooltip"
                                                data-bs-title="Informe o número completo do processo SPA. Digite somente os números, sem pontuação.">
                                                Processo SPA
                                            </label>
                                            <input type="text" class="form-control form-control-sm"
                                                id="atas-processo-spa" data-field="processo"
                                                data-validate-rule="pattern"
                                                data-regex-pattern="23080\.\d{6}/\d{4}-\d{2}" required
                                                data-validation-msg="Informe o processo no formato 23080.XXXXXX/XXXX-XX.">
                                        </div>
                                        <div class="form-group grid-4">
                                            <label for="atas-data-pregao" class="form-label" data-bs-toggle="tooltip"
                                                data-bs-title="Informe a data da publicação do pregão no DOU.">
                                                Data Pregão DOU
                                            </label>
                                            <input type="date" class="form-control form-control-sm"
                                                id="atas-data-pregao" data-field="data" required
                                                data-validation-msg="Informe a data do pregão.">
                                        </div>
                                        <div class="form-group grid-5">
                                            <label for="atas-primeira-ata" class="form-label" data-bs-toggle="tooltip"
                                                data-bs-title="Informe o número da primeira Ata a ser gerada. As próximas serão numeradas automaticamente, conforme os relatórios SICAF presentes na pasta.">
                                                Primeira Ata/Ano
                                            </label>
                                            <div class="input-group input-group-sm" data-validate-rule="required"
                                                data-validate-target="atas-primeira-ata,atas-ano-ata">
                                                <input type="number" class="form-control form-control-sm"
                                                    id="atas-primeira-ata" data-field="n_ata" min="1"
                                                    data-validate-rule="numeric" required
                                                    data-validation-msg="Informe o número e o ano da primeira ata.">
                                                <select class="form-select form-select-sm" id="atas-ano-ata"
                                                    data-field="ano_ata" data-validate-rule="numeric" required>
                                                    <option value="">-- Selecione --</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-group grid-7">
                                            <label for="atas-objeto" class="form-label" data-bs-toggle="tooltip"
                                                data-bs-title="Informe o objeto do pregão conforme o Edital. Na Ata, esta informação será incluída após o trecho 'REGISTRAR PREÇO...'.">
                                                Objeto
                                            </label>
                                            <textarea id="atas-objeto" class="form-control form-control-sm"
                                                data-field="objeto" rows="4" required
                                                data-validation-msg="Informe o objeto do pregão."></textarea>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="col">
                            <!-- Lista de Relatórios SICAF -->
                            <div class="panel shadow-sm">
                                <h4 class="panel-header" data-compras-icon="contact_page"
                                    data-compras-title="Relatórios SICAF"
                                    data-compras-help="Coloque nesta pasta os relatórios de credenciamento obtidos no SICAF em PDF de todos os fornecedores vencedores do pregão.
                                    <br><br>Obs.: nomeie-os em ordem alfabética ou com o número da respectiva Ata, para evitar inconsistências.">
                                </h4>

                                <div class="collapse show" id="atas-relatorios-sicaf-collapse">
                                    <div id="atas-relatorios-sicaf" class="files-list" data-extensions="pdf"
                                        data-folder="sicaf" data-selectable="false">
                                    </div>
                                    <div class="form-buttons">
                                        <button type="button" class="btn btn-sm btn-primary btn-run text-nowrap"
                                            id="btn-form-info-pregao" data-script-name="atas">
                                            Obter dados dos SICAF
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <!-- Status Dados -->
                            <div class="panel shadow-sm">
                                <h4 class="panel-header" data-compras-icon="analytics"
                                    data-compras-title="Dados obtidos"
                                    data-compras-help="Arquivo com os dados obtidos do pregão e dos fornecedores. Antes de gerar as Atas na próxima aba, verifique se o arquivo refere-se ao pregão correto (<em>duplo-clique abre o arquivo</em>).">
                                </h4>
                                <div class="collapse show" id="dados-obtidos-collapse">
                                    <div id="status-dados-atas">
                                        <div class="dashboard-widget-grid">
                                            <div class="dashboard-widget">
                                                <div id="atas-widget-icon-status" class="widget-icon">
                                                    <i class="material-symbols-outlined">storage</i>
                                                </div>
                                                <div class="widget-content">
                                                    <span class="widget-label">Última atualização</span>
                                                    <span class="widget-value"
                                                        id="atas-widget-text-status">Verificando...</span>
                                                </div>
                                            </div>
                                            <div class="dashboard-widget">
                                                <div id="atas-widget-icon-resultado" class="widget-icon">
                                                    <i class="material-symbols-outlined">analytics</i>
                                                </div>
                                                <div class="widget-content">
                                                    <span class="widget-label">Status</span>
                                                    <span class="widget-value" id="atas-widget-text-resultado">-</span>
                                                </div>
                                            </div>
                                            <div class="dashboard-widget">
                                                <div class="widget-icon">
                                                    <i class="material-symbols-outlined">description</i>
                                                </div>
                                                <div class="widget-content">
                                                    <span class="widget-label">Fornecedores</span>
                                                    <span class="widget-value" id="atas-widget-text-lidos">-</span>
                                                </div>
                                            </div>
                                            <div class="dashboard-widget border border-warning"
                                                id="atas-widget-duplicados" style="display: none">
                                                <div class="widget-icon">
                                                    <i class="material-symbols-outlined">warning</i>
                                                </div>
                                                <div class="widget-content">
                                                    <span class="widget-label"
                                                        id="atas-widget-text-duplicados-label">Alertas</span>
                                                    <span class="widget-value" id="atas-widget-text-duplicados">-</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div id="atas-dados-arquivo" class="files-list" data-folder="RAIZ"
                                        data-name-contains="dados_atas.xlsx" data-selectable="false">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="content-atas-atas" role="tabpanel">
                    <div class="row">
                        <div class="col">
                            <!-- Modelos de Ata -->
                            <div id="form-atas-modelos" class="panel shadow-sm">
                                <h4 class="panel-header" data-compras-icon="text_snippet"
                                    data-compras-title="Modelos de Ata"
                                    data-compras-help="Selecione o modelo de ata em formato <em>.docx</em> a ser utilizado. 
                                    <br><br>O modelo deve conter marcadores de mesclagem (<em>&amp;lt;&amp;lt;nome_do_campo&amp;gt;&amp;gt;</em>) correspondentes aos campos extraídos dos relatórios SICAF e das informações do pregão.
                                    <br><br>Cada &amp;lt;&amp;lt;nome_do_campo&amp;gt;&amp;gt; corresponde aos nomes das colunas do arquivo <em>dados_atas.xlsx</em>">
                                </h4>

                                <div class="collapse show" id="atas-modelos-collapse">
                                    <!-- Lista de Modelos -->
                                    <div id="atas-modelos" class="files-list" data-field="atas_modelos"
                                        data-validate-rule="file-selectable" required data-extensions="docx"
                                        data-folder="atas_modelos" data-selectable="true" data-grid-view="true"
                                        data-validation-msg="Selecione um modelo de ata.">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col">
                            <!-- Lista de Tabelas -->
                            <div class="panel shadow-sm">
                                <h4 class="panel-header" data-compras-icon="table_chart"
                                    data-compras-title="Tabelas de Itens"
                                    data-compras-help="Lista dos itens do Termo de Referência de cada fornecedor do pregão. 
                                    São mesclados com o modelo de ata selecionado para a edição da Ata.
                                    <br><br>Observações:
                                    <ul>
                                        <li>nomeie-os em ordem alfabética ou com o número da respectiva Ata, para evitar inconsistências.</li>
                                        <li>este arquivo é opcional. Caso não esteja presente, a Ata será gerada sem a tabela de itens, que deverá ser posteriormente incluída manualmente.">
                                </h4>

                                <div class="collapse show" id="atas-tabelas-collapse">
                                    <div id="atas-tabelas" class="files-list" data-extensions="xls*" data-folder="sicaf"
                                        data-selectable="false">
                                    </div>
                                    <!-- Botão Gerar Atas -->
                                    <div class="form-buttons">
                                        <button type="button" class="btn btn-sm btn-primary btn-run text-nowrap"
                                            id="btn-form-atas-modelos" onclick="executarMailmergeAtas()" disabled>
                                            Gerar Atas
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <!-- Atas Finalizadas -->
                            <div class="panel shadow-sm">
                                <h4 class="panel-header" data-compras-icon="assignment_turned_in"
                                    data-compras-title="Atas finalizadas">
                                </h4>
                                <div class="collapse show" id="atas-finalizadas-collapse">
                                    <div id="atas-finalizadas" class="files-list" data-folder="atas_finalizadas"
                                        data-selectable="false">
                                        <div class="no-files-message">Não há Atas finalizadas.</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
