<!DOCTYPE html>
<div class="row">
    <div class="col-sm-6">
        <!-- Quadro Pregões -->
        <div class="script-form shadow-sm">
            <h4 class="script-form-header" data-compras-icon="folder" data-compras-title="Pregões" data-compras-help="Lista os pregões disponíveis na pasta de dados. Cada entrada corresponde a uma subpasta com os arquivos enviados pelos fornecedores.
                <br><br>Selecione o pregão desejado para visualizar os arquivos disponíveis e obter os dados.">
            </h4>
            <div class="collapse show" id="fornecedores-pregoes-collapse">
                <div id="fornecedores-pregoes-list" class="fornecedores-grid-list" data-validate-rule="file-selectable"
                    data-field="lista-pregoes" required data-validation-msg="Selecione um pregão.">
                    <div class="custom-spinner-container">
                        <div class="custom-spinner text-primary">
                            <div class="spinner-border"></div>
                            <span role="status">Carregando pregões...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Quadro Conteúdo da Pasta -->
        <div class="script-form shadow-sm">
            <h4 class="script-form-header" data-compras-icon="folder_open" data-compras-title="Conteúdo da pasta"
                data-compras-title-id="conteudo-pasta-titulo">
            </h4>
            <div class="collapse show" id="fornecedores-conteudo-collapse">
                <div id="fornecedores-conteudo-list" class="files-list-style">
                    <div class="alert alert-info" role="alert">
                        <i class="material-symbols-outlined">info</i> Selecione um pregão para ver os arquivos
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="col-sm-6">
        <!-- Quadro Informações do Pregão -->
        <div class="script-form shadow-sm">
            <h4 class="script-form-header" data-compras-icon="info" data-compras-title="Informações do Pregão">
            </h4>
            <div class="collapse show" id="fornecedores-info-collapse">
                <div id="fornecedores-info-pregao">
                    <div class="dashboard-widget-grid">
                        <div class="dashboard-widget">
                            <div class="widget-icon">
                                <i class="material-symbols-outlined">gavel</i>
                            </div>
                            <div class="widget-content">
                                <span class="widget-label">Pregão</span>
                                <span class="widget-value" id="info-pregao-numero">-</span>
                            </div>
                        </div>
                        <div class="dashboard-widget">
                            <div class="widget-icon">
                                <i class="material-symbols-outlined">description</i>
                            </div>
                            <div class="widget-content">
                                <span class="widget-label">Fornecedores</span>
                                <span class="widget-value" id="info-pregao-qtd">-</span>
                            </div>
                        </div>
                        <div class="dashboard-widget">
                            <div class="widget-icon">
                                <i class="material-symbols-outlined">info</i>
                            </div>
                            <div class="widget-content">
                                <span class="widget-label">Gerado?</span>
                                <span class="widget-value" id="info-pregao-gerado">-</span>
                            </div>
                        </div>
                        <div class="dashboard-widget">
                            <div class="widget-icon">
                                <i class="material-symbols-outlined">info</i>
                            </div>
                            <div class="widget-content">
                                <span class="widget-label">Com erros?</span>
                                <span class="widget-value" id="info-pregao-erros">-</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn btn-sm btn-primary btn-run text-nowrap"
                        id="btn-obter-dados-fornecedores" disabled>
                        Obter dados dos fornecedores
                    </button>
                </div>
            </div>
        </div>

        <!-- Quadro Arquivos a Importar -->
        <div class="script-form shadow-sm">
            <h4 class="script-form-header" data-compras-icon="table_chart" data-compras-title="Arquivos a importar"
                data-compras-help="Arquivo .csv pronto para importação no MATL.
                <br><br>Clique no botão 'Abrir arquivo de conferência' para verificar se os dados foram obtidos corretamente.
                <br><br>Clique no botão 'Mover para pasta Documentos' para que o MATL localize o arquivo.
                <br><br>Após a importação, a pasta com os dados e o arquivo de importação podem ser excluídos.">
            </h4>
            <div class="collapse show" id="fornecedores-importar-collapse">
                <div id="fornecedores-importar-list" class="files-list-style fornecedores-importar-list">
                    <div class="custom-spinner-container">
                        <div class="custom-spinner text-primary">
                            <div class="spinner-border"></div>
                            <span role="status">Carregando arquivos...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
