<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="description"
        content="Some scripts to help my colleagues with activities related to public procurement / Alguns scripts para auxiliar meus colegas nas atividades relacionadas a compras públicas">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras</title>

    <!-- Preconnect para CDNs -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <!-- Popper.js (dependência do Bootstrap para tooltips) -->
    <script defer src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>

    <!-- Bootstrap CSS and JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome 6 (ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/console.css">
</head>

<body>

    <!-- Barra de navegação superior fixa -->
    <header class="top-nav shadow" id="navbar">
        <div class="navbar-content">
            <div class="navbar-left">
                <img src="img/company.svg" class="navbar-logo" id="companyLogo" alt="Logo da empresa">
                <img src="img/department.png" class="navbar-logo navbar-logo-department" id="departmentLogo"
                    alt="Logo do Departamento">
                <button id="homeBtn" class="header-icon-btn" aria-label="Página inicial" data-bs-toggle="tooltip"
                    data-bs-title="Página inicial" style="display: none;">
                    <i class="fa-solid fa-home"></i>
                </button>
                <div class="nav-subtitle" id="nav-subtitle"></div>
            </div>
            <div class="header-actions">
                <button id="darkModeBtn" class="header-icon-btn" aria-label="Ativar/desativar modo escuro"
                    data-bs-toggle="tooltip" data-bs-title="Ativar/desativar modo escuro" onclick="applyDarkMode()">
                    <i class="fa-solid fa-sun"></i>
                </button>
                <button id="userBtn" class="header-icon-btn" aria-label="Informações do usuário"
                    data-bs-toggle="tooltip" data-bs-title="Informações do usuário">
                    <i class="fa-solid fa-user-circle"></i>
                </button>
                <button id="settingsBtn" class="header-icon-btn" aria-label="Preferências" data-bs-toggle="tooltip"
                    data-bs-title="Preferências">
                    <i class="fa-solid fa-cog"></i>
                </button>
                <button id="notificationsBtn" class="header-icon-btn" aria-label="Notificações" data-bs-toggle="tooltip"
                    data-bs-title="Notificações">
                    <i class="fa-solid fa-bell"></i>
                </button>
                <button id="appLauncherBtn" class="header-icon-btn" aria-label="Aplicativos" data-bs-toggle="tooltip"
                    data-bs-title="Aplicativos">
                    <i class="fa-solid fa-grip-vertical"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Tab buttons ocultos (ativados via App Launcher) -->
    <div class="d-none" id="hidden-tablist" role="tablist">
        <a id="home-tab" data-bs-toggle="pill" data-bs-target="#home" role="tab" aria-controls="home"></a>
        <a id="atas-tab" data-bs-toggle="pill" data-bs-target="#atas" role="tab" aria-controls="atas"></a>
        <a id="catmat-tab" data-bs-toggle="pill" data-bs-target="#catmat" role="tab" aria-controls="catmat"></a>
        <a id="fornecedores-tab" data-bs-toggle="pill" data-bs-target="#fornecedores" role="tab"
            aria-controls="fornecedores"></a>
        <a id="importacao-tab" data-bs-toggle="pill" data-bs-target="#importacao" role="tab"
            aria-controls="importacao"></a>
        <a id="mapas-tab" data-bs-toggle="pill" data-bs-target="#mapas" role="tab" aria-controls="mapas"></a>
        <a id="powerbi-tab" data-bs-toggle="pill" data-bs-target="#powerbi" role="tab" aria-controls="powerbi"></a>
        <a id="instalacao-tab" data-bs-toggle="pill" data-bs-target="#instalacao" role="tab"
            aria-controls="instalacao"></a>
    </div>

    <main class="container-fluid p-1 m-1 shadow-sm rounded-4" id="mainContent">

        <div class="tab-content" id="tabContent">

            <!-- Aba Home -->
            <div class="tab-pane fade" id="home" role="tabpanel" aria-labelledby="home-tab"
                data-load-url="tabs/home.html">
                <div class="custom-spinner text-primary">
                    <div class="spinner-border"></div>
                    <span role="status">Carregando aba...</span>
                </div>
            </div>

            <!-- Aba Atas -->
            <div class="tab-pane fade" id="atas" role="tabpanel" aria-labelledby="atas-tab"
                data-load-url="tabs/atas.html">
                <div class="custom-spinner text-primary">
                    <div class="spinner-border"></div>
                    <span role="status">Carregando aba...</span>
                </div>
            </div>

            <!-- Aba CATMAT -->
            <div class="tab-pane fade" id="catmat" role="tabpanel" aria-labelledby="catmat-tab"
                data-load-url="tabs/catmat.html">
                <div class="custom-spinner text-primary">
                    <div class="spinner-border"></div>
                    <span role="status">Carregando aba...</span>
                </div>
            </div>

            <!-- Aba Mapas -->
            <div class="tab-pane fade" id="mapas" role="tabpanel" aria-labelledby="mapas-tab"
                data-load-url="tabs/mapas.html">
                <div class="custom-spinner text-primary">
                    <div class="spinner-border"></div>
                    <span role="status">Carregando aba...</span>
                </div>
            </div>

            <!-- Aba Fornecedores -->
            <div class="tab-pane fade" id="fornecedores" role="tabpanel" aria-labelledby="fornecedores-tab"
                data-load-url="tabs/fornecedores.html">
                <div class="custom-spinner text-primary">
                    <div class="spinner-border"></div>
                    <span role="status">Carregando aba...</span>
                </div>
            </div>

            <!-- Aba Importação -->
            <div class="tab-pane fade" id="importacao" role="tabpanel" aria-labelledby="importacao-tab"
                data-load-url="tabs/importacao.html">
                <div class="custom-spinner text-primary">
                    <div class="spinner-border"></div>
                    <span role="status">Carregando aba...</span>
                </div>
            </div>

            <!-- Aba Power BI -->
            <div class="tab-pane fade" id="powerbi" role="tabpanel" aria-labelledby="powerbi-tab"
                data-load-url="tabs/powerbi.html">
                <div class="custom-spinner text-primary">
                    <div class="spinner-border"></div>
                    <span role="status">Carregando aba...</span>
                </div>
            </div>

            <!-- Aba Primeiro Uso -->
            <div class="tab-pane fade" id="instalacao" role="tabpanel" aria-labelledby="instalacao-tab"
                data-load-url="tabs/instalacao.html">
                <div class="custom-spinner text-primary">
                    <div class="spinner-border"></div>
                    <span role="status">Carregando aba...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Painel de Configurações (Settings Panel) -->
    <div id="settings-panel" class="header-panel" role="dialog" aria-label="Configurações" aria-hidden="true">
        <div class="header-panel-header">
            <span><i class="fa-solid fa-cog me-2"></i>Preferências</span>
            <button class="header-panel-close" id="settingsPanelClose" aria-label="Fechar"><i
                    class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="header-panel-body" id="settings-panel-body">
            <!-- Preferências de Interface -->
            <div class="form-group mb-3">
                <div class="form-check form-switch">
                    <input type="checkbox" role="switch" id="darkMode" class="form-check-input" data-field="darkMode">
                    <label for="darkMode" class="form-label">
                        <i class="fa-solid fa-moon"></i> Modo Escuro
                    </label>
                    <div class="form-text">Ativa o tema escuro ao abrir a página</div>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">
                    <i class="fa-solid fa-star"></i> Aba preferida ao iniciar:
                </label>
                <div class="btn-group-vertical d-grid justify-content-start" id="preferredTab" role="group"
                    aria-label="Preferred Tab">
                </div>
            </div>
        </div>
    </div>

    <!-- Painel do Usuário (User Panel) -->
    <div id="user-panel" class="header-panel" role="dialog" aria-label="Usuário" aria-hidden="true">
        <div class="header-panel-header">
            <span><i class="fa-solid fa-user-circle me-2"></i>Usuário</span>
            <button class="header-panel-close" id="userPanelClose" aria-label="Fechar"><i
                    class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="header-panel-body">
            <div class="user-panel-avatar">
                <i class="fa-solid fa-user-circle"></i>
            </div>
            <div class="user-panel-info">
                <div class="user-panel-row">
                    <span class="user-panel-label"><i class="fa-solid fa-desktop me-1"></i> Computador</span>
                    <span class="user-panel-value" id="userComputerName">Carregando...</span>
                </div>
                <div class="user-panel-row">
                    <span class="user-panel-label"><i class="fa-solid fa-clock me-1"></i> Última sincronização</span>
                    <span class="user-panel-value" id="lastSyncTime">—</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Painel de Notificações (Notifications Panel) -->
    <div id="notifications-panel" class="header-panel" role="dialog" aria-label="Notificações" aria-hidden="true">
        <div class="header-panel-header">
            <span><i class="fa-solid fa-bell me-2"></i>Notificações</span>
            <button class="header-panel-close" id="notificationsPanelClose" aria-label="Fechar"><i
                    class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="header-panel-body" id="notifications-panel-body">
            <div class="notification-list" id="notification-list">
            </div>
            <div class="notification-footer" id="notification-footer" style="display: none;">
                <button class="notification-clear-all" id="notification-clear-all">
                    <i class="fa-solid fa-trash-alt me-1"></i>Limpar tudo
                </button>
            </div>
        </div>
    </div>

    <!-- Painel App Launcher -->
    <div id="app-launcher-panel" class="header-panel" role="dialog" aria-label="Aplicativos" aria-hidden="true">
        <div class="header-panel-header">
            <span><i class="fa-solid fa-grip-vertical me-2"></i>Aplicativos</span>
            <button class="header-panel-close" id="appLauncherPanelClose" aria-label="Fechar"><i
                    class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="header-panel-body">
            <div class="app-launcher-grid" id="app-launcher-grid">
            </div>
        </div>
    </div>

    <!-- Overlay para fechar painéis ao clicar fora -->
    <div id="header-panel-overlay"></div>

    <script defer src="js/storage.js"></script>
    <script defer src="js/notifications.js"></script>
    <script defer src="js/interface.js"></script>
    <script defer src="js/validation.js"></script>
    <script defer src="js/file_system.js"></script>
    <script defer src="js/console.js"></script>
    <script defer src="js/navigation.js"></script>
    <script defer src="js/main.js"></script>

</body>

</html>
