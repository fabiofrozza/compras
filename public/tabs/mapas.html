<!DOCTYPE html>
<div class="row">
    <div class="col">
        <!-- Mapas a processar -->
        <div class="script-form shadow-sm">
            <h4 class="script-form-header" data-compras-icon="gavel" data-compras-title="Mapas a processar"
                data-compras-help="Coloque nesta pasta os arquivos Excel dos Mapas de Licitação obtidos no Solar. O script processa todos os arquivos encontrados e gera as listas prévias formatadas.">
            </h4>
            <div class="collapse show" id="mapas-a-processar-collapse">
                <div id="mapas-mapas-a-processar" data-extensions="xls*" class="files-list" data-folder="mapas"
                    data-selectable="false">
                </div>
            </div>
        </div>
    </div>
    <div class="col">
        <!-- Forma de geração -->
        <form id="form-mapas" class="script-form shadow-sm">
            <h4 class="script-form-header" data-compras-icon="filter_alt" data-compras-title="Forma de geração">
            </h4>
            <div class="collapse show" id="mapas-forma-geracao-collapse">
                <div class="form-group">
                    <div class="option-card-group">
                        <label class="option-card">
                            <i class="material-symbols-outlined option-card-icon">
                                looks_one
                            </i>
                            <div>
                                <div class="option-card-title">Agrupada</div>
                                <div class="option-card-description">gera uma única lista consolidando todos os itens de
                                    todos os mapas presentes na pasta. Útil para visão geral do processo</div>
                            </div>
                            <input class="form-check-input" type="radio" name="mapas-estilo" value="grupo" checked>
                        </label>
                        <label class="option-card">
                            <i class="material-symbols-outlined option-card-icon">
                                list_alt
                            </i>
                            <div>
                                <div class="option-card-title">Por processo</div>
                                <div class="option-card-description">gera uma lista separada para cada processo/mapa
                                    encontrado. Útil quando há múltiplos processos distintos a serem controlados
                                    individualmente</div>
                            </div>
                            <input class="form-check-input" type="radio" name="mapas-estilo" value="processo">
                        </label>
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn btn-sm btn-primary btn-run text-nowrap" id="btn-run-mapas"
                        data-script-name="mapas">
                        Gerar listas prévias
                    </button>
                </div>
            </div>
        </form>
        <!-- Listas processadas -->
        <div class="script-form shadow-sm">
            <h4 class="script-form-header" data-compras-icon="list" data-compras-title="Listas processadas">
            </h4>
            <div class="collapse show" id="mapas-listas-collapse">
                <div id="mapas-listas-processadas" class="files-list" data-folder="listas" data-selectable="false">
                </div>
            </div>
        </div>
    </div>
</div>
