<!DOCTYPE html>
<div class="row">
    <div class="col">
        <!-- Itens do TR -->
        <div id="form-itens-tr" class="panel shadow-sm">
            <h4 class="panel-header" data-compras-icon="shopping_basket" data-compras-title="Itens do TR"
                data-compras-help="Selecione o arquivo Excel obtido no Solar contendo os itens do Termo de Referência.">
            </h4>
            <div class="collapse show" id="catmat-itens-tr-collapse">
                <div id="catmat-lista-itens-tr" class="files-list" data-field="lista-itens-tr" data-extensions="xls*"
                    data-validate-rule="file-selectable" required data-folder="tr" data-selectable="true"
                    data-validation-msg="Selecione um arquivo.">
                </div>
            </div>
        </div>
        <!-- Arquivos auxiliares -->
        <div class="panel shadow-sm">
            <h4 class="panel-header" data-compras-icon="folder" data-compras-title="Arquivos auxiliares"
                data-compras-help="
Para a consulta local, são obrigatórios os seguintes arquivos (nomeados exatamente como mostrados a seguir).<br>
<ul><li><strong>Lista CATMAT.xlsx</strong>: obtida do site oficial do Governo, contendo as colunas (a partir da linha 3) Código do Grupo, Nome do Grupo, Código da Classe, Nome da Classe, Código do PDM, Nome do PDM, Código do Item, Descrição do Item e Código NCM.
</li><li><strong>Margens.xlsx</strong>: contendo as colunas NCM, Descrição, Regra de origem, Margem normal, Regra de qualificação e Margem adicional.</li></ul>
<em>Para a consulta via API, somente <strong>Margens.xlsx</strong> é obrigatório.</em>">
            </h4>
            <div class="collapse show" id="catmat-auxiliares-collapse">
                <div id="catmat-arquivos-auxiliares" class="files-list" data-folder="_fontes" data-selectable="false">
                </div>
            </div>
        </div>
    </div>
    <div class="col">
        <!-- Escolha para execução -->
        <form id="panel-catmat" class="panel shadow-sm">
            <h4 class="panel-header" data-compras-icon="filter_alt" data-compras-title="Forma de consulta">
            </h4>
            <div class="collapse show" id="catmat-forma-consulta-collapse">
                <div class="form-group">
                    <div class="option-card-group">
                        <label class="option-card">
                            <i class="material-symbols-outlined option-card-icon">
                                table_chart
                            </i>
                            <div>
                                <div class="option-card-title">Lista de CATMATs</div>
                                <div class="option-card-description">Consulta ao arquivo local presente na pasta de
                                    arquivos auxiliares</div>
                            </div>
                            <input class="form-check-input" type="radio" name="catmat-metodo" value="lista" checked>
                        </label>
                        <label class="option-card">
                            <i class="material-symbols-outlined option-card-icon">
                                cloud_download
                            </i>
                            <div>
                                <div class="option-card-title">API</div>
                                <div class="option-card-description">Consulta direta aos Dados Abertos do Governo
                                    Federal</div>
                            </div>
                            <input class="form-check-input" type="radio" name="catmat-metodo" value="api">
                        </label>
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn btn-sm btn-primary btn-run text-nowrap" id="btn-panel-itens-tr"
                        data-script-name="catmat">
                        Verificar margens de preferência
                    </button>
                </div>
            </div>
        </form>
        <!-- Listas processadas -->
        <div class="panel shadow-sm">
            <h4 class="panel-header" data-compras-icon="percent" data-compras-title="Margens de preferência">
            </h4>
            <div class="collapse show" id="catmat-margens-collapse">
                <div id="catmat-arquivos-gerados" class="files-list" data-folder="arquivos_gerados"
                    data-selectable="false">
                </div>
            </div>
        </div>
    </div>
</div>
